apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: keycloak-db-pooler-rw
  namespace: keycloak
  labels:
    app.kubernetes.io/name: keycloak-db
    app.kubernetes.io/component: pooler
    app.kubernetes.io/part-of: keycloak-platform
spec:
  cluster:
    name: keycloak-db

  instances: 1

  type: rw

  pgbouncer:
    poolMode: session
    parameters:
      max_client_conn: "1000"
      default_pool_size: "25"
      ignore_startup_parameters: "extra_float_digits,search_path,options"
      server_idle_timeout: "300"
      client_idle_timeout: "0"
      server_connect_timeout: "5"
      query_wait_timeout: "60"
      max_prepared_statements: "200"

  monitoring:
    enablePodMonitor: false

  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak-db
        app.kubernetes.io/component: pooler
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    cnpg.io/poolerName: keycloak-db-pooler-rw
      containers:
        - name: pgbouncer
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
